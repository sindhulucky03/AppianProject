name: build-and-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify unit and Testcontainers integration tests
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Publish test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/**
            target/site/jacoco/**
          if-no-files-found: warn
      - name: Build container image
        run: docker build --tag audit-log-service:${{ github.sha }} .
